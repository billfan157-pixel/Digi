name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS (Deep Sync)
        run: |
          echo "🔄 Syncing iOS platform deeply..."
          npx cap sync ios
          # Kiểm tra xem plugin Health và Geolocation có trong folder ios không
          if [ -d "ios/App/Pods/@capgo" ] || [ -d "ios/App/App/Pods" ]; then
            echo "✅ Pods found."
          else
            echo "⚠️ Pods not found, trying to install via CocoaPods manually..."
            cd ios/App && pod install || true
            cd ../..
          fi

      - name: Fix iOS Scheme
        run: |
          cd ios/App
          mkdir -p App.xcscheme/_xcshareddata
          if [ -f "App.xcscheme/App.xcscheme" ]; then
            cp App.xcscheme/App.xcscheme App.xcscheme/_xcshareddata/App.xcscheme
            echo "✅ Scheme copied successfully."
          else
            echo "❌ Error: App.xcscheme not found!"
            exit 1
          fi

      - name: Build iOS App
        id: build_step
        run: |
          cd ios/App
          echo "🚀 Starting xcodebuild with verbose logging..."
          
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     ONLY_ACTIVE_ARCH=NO \
                     -allowProvisioningUpdates \
                     clean build \
                     -verbose 2>&1 | tee build_log.txt
          
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ BUILD FAILED! Last 50 lines of log:"
            tail -n 50 build_log.txt
            exit 1
          fi
          echo "✅ Build finished successfully."

      - name: Find App Bundle
        id: find_app
        run: |
          echo "🔍 Searching for App.app bundle..."
          # Tìm chính xác trong thư mục build_output vừa tạo
          APP_PATH=$(find ios/App/build_output -name "App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ CRITICAL: App.app not found in build_output!"
            echo "Contents of build_output:"
            ls -R ios/App/build_output || echo "Folder empty."
            exit 1
          fi
          
          echo "✅ Found App at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: APP_PATH is empty."
            exit 1
          fi
          echo "Copying app to Payload..."
          cp -r "$APP_PATH" Payload/
          echo "Zipping IPA..."
          zip -qr DigiWell-iOS.ipa Payload
          echo "✅ IPA created: $(ls -lh DigiWell-iOS.ipa)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWell-iOS-Unsigned
          path: DigiWell-iOS.ipa
          retention-days: 7