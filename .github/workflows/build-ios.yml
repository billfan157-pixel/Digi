name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Fix iOS Scheme (Copy file có sẵn)
        run: |
          cd ios/App
          mkdir -p App.xcscheme/_xcshareddata
          # Copy file scheme đã tạo sẵn từ bước 1 vào đúng vị trí
          cp App.xcscheme/App.xcscheme App.xcscheme/_xcshareddata/App.xcscheme
          echo "Scheme copied successfully."

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          APP_PATH=$(find build_output -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find App.app"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -qr DigiWell-iOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWell-iOS-Unsigned
          path: DigiWell-iOS.ipa
          retention-days: 7