name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Fix iOS Scheme
        run: |
          cd ios/App
          mkdir -p App.xcscheme/_xcshareddata
          if [ -f "App.xcscheme/App.xcscheme" ]; then
            cp App.xcscheme/App.xcscheme App.xcscheme/_xcshareddata/App.xcscheme
            echo "✅ Scheme copied successfully."
          else
            echo "❌ Error: App.xcscheme not found!"
            exit 1
          fi

      - name: Build iOS App (Verbose Mode)
        id: build_step
        run: |
          cd ios/App
          echo "🚀 Starting xcodebuild..."
          
          # Chạy build và in log chi tiết
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build \
                     -verbose || {
                       echo "❌ BUILD FAILED! Check logs above."
                       exit 1
                     }
          
          echo "✅ Build finished successfully."

      - name: Debug Build Output
        run: |
          echo "🔍 Searching for .app file..."
          # Tìm trong toàn bộ thư mục ios/App
          APP_PATH=$(find ios/App -name "App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ CRITICAL ERROR: App.app not found anywhere!"
            echo "Listing contents of ios/App/build_output (if exists):"
            ls -R ios/App/build_output || echo "build_output folder does not exist."
            exit 1
          else
            echo "✅ Found App at: $APP_PATH"
            # Lưu đường dẫn vào file tạm để bước sau dùng
            echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          fi

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: APP_PATH variable is empty."
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -qr DigiWell-iOS.ipa Payload
          echo "✅ IPA created successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWell-iOS-Unsigned
          path: DigiWell-iOS.ipa
          retention-days: 7