name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Web App
        run: npm run build

      # --- BƯỚC QUAN TRỌNG NHẤT: TÁI TẠO MÔI TRƯỜNG iOS SẠCH ---
      - name: Re-create iOS Platform (Fix Scheme & Plugins)
        run: |
          # Xóa thư mục ios cũ để tránh xung đột cấu hình
          rm -rf ios
          
          # Thêm lại nền tảng iOS mới hoàn toàn (Capacitor sẽ tự tạo scheme chuẩn)
          npx cap add ios @latest
          
          # Đồng bộ code và plugins (Health, Geolocation...) vào project mới
          npx cap sync ios
          
          echo "✅ iOS platform re-created successfully with valid schemes."

      - name: Build iOS App (Unsigned)
        run: |
          cd ios/App
          
          # Build bằng xcodebuild với scheme mặc định vừa được tạo
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     clean build \
                     -quiet || {
                       echo "❌ Build failed! Showing detailed logs:"
                       exit 1
                     }
          
          echo "✅ Build completed successfully."

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          
          # Tìm file .app trong thư mục build_output
          APP_PATH=$(find ios/App/build_output -name "App.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: Could not find App.app in build_output"
            echo "Contents of build_output:"
            ls -R ios/App/build_output || true
            exit 1
          fi
          
          echo "✅ Found App at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr DigiWell-iOS.ipa Payload
          echo "✅ IPA created successfully."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWell-iOS-Unsigned
          path: DigiWell-iOS.ipa
          retention-days: 7