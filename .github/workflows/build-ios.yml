name: Build iOS (Unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Create .env file for build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS (SPM Mode)
        run: |
          echo "🔄 Starting Deep Sync for SPM..."
          rm -rf ios/App/.git
          npx cap sync ios
          echo "✅ Sync finished. Checking Package.swift..."
          if grep -q "@capgo/capacitor-health" ios/App/Package.swift; then
            echo "✅ Health Plugin found in Package.swift"
          else
            echo "❌ Health Plugin MISSING in Package.swift!"
            exit 1
          fi
          if grep -q "@capacitor/geolocation" ios/App/Package.swift; then
            echo "✅ Geolocation Plugin found in Package.swift"
          else
            echo "❌ Geolocation Plugin MISSING in Package.swift!"
            exit 1
          fi
          echo "🎉 All plugins correctly linked via SPM!"

      - name: Fix iOS Scheme
        run: |
          cd ios/App
          mkdir -p App.xcscheme/_xcshareddata
          if [ -f "App.xcscheme/App.xcscheme" ]; then
            cp App.xcscheme/App.xcscheme App.xcscheme/_xcshareddata/App.xcscheme
            echo "✅ Scheme copied successfully."
          else
            echo "❌ Error: App.xcscheme not found!"
            exit 1
          fi

      - name: Build iOS App
        id: build_step
        run: |
          cd ios/App
          echo "🚀 Starting xcodebuild..."
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build_output CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO -allowProvisioningUpdates clean build 2>&1 | tee build_log.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ BUILD FAILED! Last 50 lines:"
            tail -n 50 build_log.txt
            exit 1
          fi
          echo "✅ Build finished successfully."

      - name: Find App Bundle
        id: find_app
        run: |
          echo "🔍 Searching for App.app..."
          APP_PATH=$(find ios/App/build_output -name "App.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ CRITICAL: App.app not found!"
            ls -R ios/App/build_output || echo "Folder empty."
            exit 1
          fi
          echo "✅ Found App at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Create IPA payload
        run: |
          mkdir -p Payload
          if [ -z "$APP_PATH" ]; then echo "❌ Error: APP_PATH is empty."; exit 1; fi
          cp -r "$APP_PATH" Payload/
          zip -qr DigiWell-iOS.ipa Payload
          echo "✅ IPA created."

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigiWell-iOS-Unsigned
          path: DigiWell-iOS.ipa
          retention-days: 7