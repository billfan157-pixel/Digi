<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06B6D4" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="DigiWell - Ứng dụng theo dõi sức khỏe và uống nước thông minh" />
    <title>DigiWell</title>

    <script>
      (function() {
        const isProduction = '%PROD%' === 'true';
        const fallbackId = 'digiwell-runtime-fallback';

        function renderFallbackScreen() {
          if (!isProduction || document.getElementById(fallbackId)) return;

          const root = document.getElementById('root');
          const fallback = document.createElement('div');
          fallback.id = fallbackId;
          fallback.setAttribute('role', 'alert');
          fallback.style.cssText = [
            'min-height:100vh',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'padding:24px',
            'background:#020617',
            'color:#e2e8f0',
            'font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif',
            'text-align:center'
          ].join(';');
          fallback.innerHTML = [
            '<div style="max-width:420px;width:100%">',
            '<div style="margin-bottom:12px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:#67e8f9">DigiWell</div>',
            '<h1 style="margin:0 0 12px;font-size:28px;line-height:1.2;color:#f8fafc">Ứng dụng cần tải lại</h1>',
            '<p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#cbd5e1">Đã xảy ra lỗi hệ thống ngoài ý muốn. Vui lòng mở lại ứng dụng để tiếp tục.</p>',
            '<button id="digiwell-runtime-reload" style="border:0;border-radius:999px;padding:12px 20px;background:#06b6d4;color:#082f49;font-weight:700;cursor:pointer">Tải lại</button>',
            '</div>'
          ].join('');

          if (root) {
            root.replaceChildren(fallback);
          } else {
            document.body.replaceChildren(fallback);
          }

          const reloadButton = document.getElementById('digiwell-runtime-reload');
          if (reloadButton) {
            reloadButton.addEventListener('click', function() {
              window.location.reload();
            });
          }
        }

        function logRuntimeError(kind, detail) {
          const payload = {
            kind,
            timestamp: new Date().toISOString(),
            detail: isProduction
              ? {
                  source: detail && detail.source ? detail.source : undefined,
                  line: detail && detail.line ? detail.line : undefined,
                  column: detail && detail.column ? detail.column : undefined,
                }
              : detail,
          };

          console.error('[DigiWell] Runtime failure', payload);
        }

        window.addEventListener('error', function(event) {
          logRuntimeError('error', {
            message: event.message,
            source: event.filename,
            line: event.lineno,
            column: event.colno,
            stack: event.error && event.error.stack ? event.error.stack : undefined,
          });
          renderFallbackScreen();
        });

        window.addEventListener('unhandledrejection', function(event) {
          logRuntimeError('unhandledrejection', {
            reason:
              event.reason instanceof Error
                ? { message: event.reason.message, stack: event.reason.stack }
                : String(event.reason || 'unknown'),
          });
          if (isProduction) {
            event.preventDefault();
          }
          renderFallbackScreen();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- ĐÃ SỬA: Thêm dấu chấm (.) vào trước src để thành đường dẫn tương đối -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
